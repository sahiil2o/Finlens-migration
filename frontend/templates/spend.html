<div class="charts-grid">
  <div class="chart-card">
    <div class="chart-header">
      <div>
        <p class="chart-title">Spending by category</p>
        <p class="chart-sub">Debits only, this cycle</p>
      </div>
      <div>
        <p class="chart-total" id="cat-total">—</p>
        <p class="chart-total-sub">total spend</p>
      </div>
    </div>
    <div style="position:relative; height:220px; display: flex; align-items: center; justify-content: center; margin-top: 0.5rem;">
      <canvas id="catChart" role="img" aria-label="Donut chart showing spending by category" style="z-index: 2;"></canvas>
      <div style="position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1;">
        <span style="font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;">Total Out</span>
        <span id="donut-center-total" style="font-family: var(--font-head); font-size: 1.25rem; font-weight: 700; color: var(--text); margin-top: 2px;">₹0</span>
      </div>
    </div>
    <div class="legend-container" id="cat-legend" style="margin-top: 1.25rem; justify-content: center; gap: 8px;"></div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div>
        <p class="chart-title">Daily spend timeline</p>
        <p class="chart-sub">Purchases per day</p>
      </div>
    </div>
    <div style="position:relative; flex: 1; min-height: 270px;">
      <canvas id="timeChart" role="img" aria-label="Bar chart of daily spending"></canvas>
    </div>
  </div>
</div>
