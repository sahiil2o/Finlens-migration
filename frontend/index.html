<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinLens — Statement Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/upload.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/trends.css">
<link rel="stylesheet" href="css/vendors.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>

<!-- Slot 1: Upload Screen -->
<div id="upload-screen"></div>

<!-- Slot 2: Dashboard -->
<div id="dashboard" style="display:none;"></div>

<div id="toast"></div>
<div id="loading-overlay" class="loading-overlay" style="display:none">
  <div class="loading-spinner"></div>
  <p class="loading-msg" id="loading-msg">Categorizing transactions…</p>
  <p class="loading-sub">Using AI to identify unknown vendors</p>
</div>

<!-- Cache panel -->
<div id="cache-panel" style="display:none; position:fixed; inset:0; z-index:300; background:rgba(13,15,20,0.85); backdrop-filter:blur(8px); align-items:center; justify-content:center;">
  <div style="background:var(--surface); border:1px solid var(--border2); border-radius:16px; padding:1.5rem; width:min(560px,92vw); max-height:80vh; display:flex; flex-direction:column; gap:1rem;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <p style="font-family:var(--font-head); font-weight:600; font-size:1rem">Vendor cache</p>
        <p style="font-size:0.72rem; color:var(--muted); margin-top:2px">Saved vendor → category mappings. Click a row to change category.</p>
      </div>
      <button class="btn-ghost" onclick="document.getElementById('cache-panel').style.display='none'">✕ Close</button>
    </div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="cache-search" placeholder="Filter vendors…" oninput="renderCachePanel()" style="flex:1; font-size:0.75rem; background:var(--surface2); border:1px solid var(--border2); color:var(--text); padding:7px 12px; border-radius:8px; outline:none; font-family:var(--font-mono);">
      <button class="btn-ghost" onclick="clearCache()" style="color:var(--red); border-color:var(--red);">Clear all</button>
    </div>
    <div id="cache-list" style="overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:4px;"></div>
    <p style="font-size:0.68rem; color:var(--faint); text-align:center" id="cache-footer"></p>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
